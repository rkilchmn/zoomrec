services:
  zoomrec_client:
    build:
      args:
        GPU_BUILD: VAAPI
        GPU_BUILD_SUBTYPE: INTEL
        RENDER_GROUPID: ${RENDER_GROUPID}
    environment:
      LIBVA_RENDER_NODE: ${LIBVA_RENDER_NODE:-renderD128}
      FFMPEG_INPUT_PARAMS: "-vaapi_device /dev/dri/${LIBVA_RENDER_NODE:-renderD128}"
      LIBVA_VIDEO_CODEC: ${LIBVA_VIDEO_CODEC:-h264_vaapi}
      FFMPEG_OUTPUT_PARAMS: "-acodec aac -b:a 128k -vf 'hwupload,scale_vaapi=format=nv12' -c:v ${LIBVA_VIDEO_CODEC:-h264_vaapi} -b:v 1M"
      LIBVA_DRIVER_NAME: ${LIBVA_DRIVER_NAME}
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - "${VIDEO_GROUPID}"
      - "${RENDER_GROUPID}"
