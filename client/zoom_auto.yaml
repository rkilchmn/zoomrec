# leave audio and video settings without changes
join_popup_audio_video_settings: &join_popup_audio_video_settings
  locate_image: 
    image: 'custom_audio_combination.png'
    iterate: 30   # default is 1
    sleep: 1      # default is 0
    on_error: "True" # webinars don't show this popop, so continue
    on_success:
      keyboard_input: 
        sequence:
          - press: 'tab'
          - press: 'tab'
          - press: 'tab'
          - press: 'tab'
          - press: 'tab'
          - press: 'tab'
          - press: 'enter'

# enter display name in join popup 
join_popup_with_name: &join_popup_with_name
  locate_image: 
    image: 'please_enter_your_name.png'
    click: "True"  # default is "False"
    iterate: 30 # zoom has started but it has to connect with URL so that might take a bit longer, default is 1
    sleep: 1 # default is 0
    on_error: "True" # webinars don't show this popop, so continue
    on_success:
      keyboard_input: 
        sequence:
          # Input display name
          - write: "{{DISPLAY_NAME}}"  
          # Configure Settings
          - press: 'tab'
          - press: 'space'
          - press: 'tab'
          - press: 'space'
          - press: 'tab'
          - press: 'space'
        on_success: *join_popup_audio_video_settings

join_popup_with_id: &join_popup_with_id
  locate_image: 
    image: 'join_meeting_button.png'
    click: "True"  # default is "False"
    iterate: 15 # zoom is starting, give it some time for this first popoup, default is 1
    sleep: 1    # default is 0
    on_error: *join_popup_with_name
    on_success:
      locate_image: 
        image: 'join_meeting_popup.png'
        iterate: 2  # default is 1
        sleep: 1    # default is 0
        on_success:
          keyboard_input: 
            sequence:
              # Insert Meeting ID
              - press: 'tab'
              - press: 'tab'
              - write: "{{MEET_ID}}"
              # Insert Name
              - press: 'tab'
              - write: "{{DISPLAY_NAME}}"
              # Configure Settings
              - press: 'tab'
              - press: 'space'
              - press: 'tab'
              - press: 'tab'
              - press: 'space'
              - press: 'tab'
              - press: 'tab'
              - press: 'space'
            on_success:
              locate_image: 
                image: 'enter_meeting_passcode.png'
                iterate: 60  # waiting to connect, default is 1
                sleep: 1     # default is 0
                on_success:
                  keyboard_input: 
                    sequence:
                      # Insert Passcode
                      - write: "{{PASSWORD}}"
                      - press: 'tab'
                      - press: 'space' # enter/click button
                    on_success: *join_popup_audio_video_settings
                    
# check if joining completed showing the "zoom workplace"
join_check_workplace: &join_check_workplace
  locate_image: 
    image: 'zoom_workplace_joined.png'
    iterate: 20
    sleep: 1

check_toolbar: &check_toolbar
  locate_image: 
    image: 'toolbar_leave.png'
    iterate: 20
    sleep: 1
    on_success: "True" # default is "True", but explicit here for clarity
    on_error: "True" # default is "False", but explicit here for clarity

audio_mute: &audio_mute
  locate_image: 
    image: 'audio_mute.png'
    click: "True"  # default is "False"
    on_success: "True" # default is "True", but explicit here for clarity
    on_error: "True" # default is "False", but explicit here for clarity

play_hello_audio: &play_hello_audio
  locate_image: 
    image: 'audio_unmute.png'
    click: "True"  # default is "False"
    on_error: "True" # continue if failed, default is "False"
    on_success:
      # check if host has disabled the ability to unmute participants
      locate_image: 
        image: 'the_host_does_not_allow_the_participants_to_unmute_themselves.png'
        iterate: 3
        sleep: 1
        on_success: 
          # click on stay muted button to close popup
          locate_image: 
            image: 'stay_muted_button.png'
            iterate: 3
            sleep: 1
            click: "True"  # default is "False"
            on_success: "True" # could not unmute but no reason to exit join process
            on_error:   "True" # could not unmute but no reason to exit join process  
        on_error: 
          # no popup found, play audio
          play_audio: 
            audio: 'hello.wav' # remove entry yo play random file from directory
            on_success: *audio_mute
            on_error: *audio_mute

# check if waiting for host
waiting_for_host: &waiting_for_host
  locate_image: 
    image: 'waiting_for_host_to_start_meeting.png'
    on_error: "True" # if image is not found, it means the meeting has started
    on_success: # image found, waiting for host to start
      locate_image:
        image: 'waiting_for_host_to_start_meeting.png'
        iterate: 600         # wait for 10 minutes
        until_found: 'False' # until image not found anymore/meeting started (success) or until max interation reached/timeout (failure),  default is 'True'
        sleep: 1

# click on view options fullscreen
view_option_fullscreen: &view_option_fullscreen
  locate_image: 
    image: 'view_options.png'
    click: "True"    # default is "False"
    on_error: "True" # continue even if not found, default is "False"
    on_success: 
      locate_image: 
        image: 'view_options_fullscreen.png'
        minSearchTime: 0.5
        iterate: 5    # options menu is sliding in, so first iteration may not be there or final position
        sleep: 1         # delays next iteration by 1 sec 
        click: "True"      # default is "False"
        on_success: "True" # default is "True", but explicit here for clarity
        on_error: "True"   # continue even if not found, default is "False"
    
# click on view options speaker view
view_option_speaker: &view_option_speaker
  locate_image: 
    image: 'view_options.png'
    click: "True"    # default is "False"
    on_error: "True" # continue even if not found, default is "False"
    on_success: 
      locate_image: 
        image: 'view_options_speaker.png'
        iterate: 5    # options menu is sliding in, so first iteration may not be there or final position
        sleep: 1         # delays next iteration by 1 sec
        click: "True"      # default is "False"
        on_success: "True" # default is "True", but explicit here for clarity
        on_error: "True"   # continue even if not found, default is "False" 

# minimize the video panel
minimize_video_panel: &minimize_video_panel
  locate_image: 
    iterate: 5    # allow some time to display
    sleep: 1      # delays next iteration by 1 sec
    image: 'video_panel_minimize.png'
    click: "True"     # default is "False"
    on_error: "True" # continue even if not found, default is "False"
    on_success: "True" # default is "True", but explicit here for clarity

# check if meeting has ended
check_meeting_ended: &check_meeting_ended
  locate_image: 
    image: 'toolbar_leave.png'
    on_success: "True" # meeting continues
    on_error:
      locate_image: 
        image: 'the_host_ended_this_meeting.png'
        iterate: 2
        sleep: 1
        on_error: "False" # meeting duration ended
        on_success: # the host ended the meeting
          set_variable:
            variable: "HOST_ENDED_MEETING"
            value: "True"
            on_success:
              locate_image: 
                image: 'the_host_ended_this_meeting_close_popup.png'
                click: "True"      # default is "False"
                on_success: "False" # meeting has ended
                on_error: "False" # meeting has ended

# close message info is here (if shown)
close_message_info_is_here: &close_message_info_is_here
  locate_image: 
    image: 'message_meeting_info_is_here.png'
    iterate: 3
    sleep: 1
    on_error: "True" # no message shown, continue meeting
    on_success:
      # click close icon
      locate_image: 
        image: 'message_close_icon.png'
        iterate: 3
        sleep: 1
        click: "True"  # default is "False"
        on_success: "True" # continue meeting
        on_error:   "True" # continue meeting

join:
  # list is processed from the top until a step returns false -> join failed, otherwise join successfull
  - *join_popup_with_id 
  - *join_check_workplace
  - *waiting_for_host
  - *view_option_speaker
  - *view_option_fullscreen
  - *minimize_video_panel
  - *check_toolbar
  - *play_hello_audio
  # - *close_message_info_is_here
  
ongoing:
  # list is processed from the top until a step returns false -> meeting ended, otherwise meeting continues
  - *check_meeting_ended
  # - *close_message_info_is_here