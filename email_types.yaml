# Email configuration for timezone mapping
emails:
  - type: "plain email"
    user_login: "johndoe"
    content_type: "text/html"
    sections:
      - section: "body"
        timezone_regex: "[APM]{2}\\s([\\w( ),]+)"
        ai_timezone_mapping:
          provider: "openrouter"
          model: "meta-llama/llama-4-maverick"
          prompt_template: "return the timezone string for \"{timezone}\" in IANA Time Zone Database (tzdata) format without any further information"
          api_key_env: "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"
          api_url: "https://openrouter.ai/api/v1/chat/completions"

  - type: "zoom_ics"
    user_login: "johndoe"
    content_type: "text/calendar"
    sections:
      - section: "calendar"
        timezone_regex: "[APM]{2}\\s([\\w( ),]+)"
        ai_timezone_mapping:
          provider: "openrouter"
          model: "mistralai/mistral-7b-instruct"
          prompt_template: "return the timezone string for \"{timezone}\" in IANA Time Zone Database (tzdata) format"
          api_key_env: "OPENROUTER_API_KEY"
          api_url: "https://openrouter.ai/api/v1/chat/completions"
