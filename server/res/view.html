<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Player - {{basename}}</title>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: sans-serif; }
    .debug-toggle {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #4CAF50;
      border: 1px solid #4CAF50;
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
      z-index: 1000;
      font-size: 12px;
    }
    .debug-toggle:hover {
      background: rgba(76, 175, 80, 0.2);
    }
    .container { display: flex; flex-direction: column; height: 100vh; }
    .video-container { 
      position: relative;
      width: 100%;
      height: 80%;
      background: #000;
      cursor: pointer;
    }
    video { 
      width: 100%; 
      height: 100%; 
      background: #000; 
      display: block;
    }
    .play-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.7);
      z-index: 10;
    }
    .play-button {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }
    .play-button:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }
    .play-button::after {
      content: '';
      width: 0;
      height: 0;
      border-top: 20px solid transparent;
      border-bottom: 20px solid transparent;
      border-left: 30px solid white;
      margin-left: 5px;
    }
    .hint { padding: 8px 12px; background: #0b0b0b; font-size: 12px; color: #bbb; }
    .debug { 
      padding: 12px; 
      background: #222; 
      font-family: monospace; 
      white-space: pre-wrap;
      font-size: 12px;
      color: #4CAF50;
      max-height: 100px;
      overflow-y: auto;
    }
    .error { color: #f44336; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>{{basename}}</header>
    <div class="hint">
      Use the scroll bar to seek. 
      <span id="debug-info">Loading video...</span>
    </div>
    <div class="video-container" id="video-container">
      <div class="play-overlay" id="play-overlay">
        <div class="play-button" id="play-button" title="Click to play"></div>
      </div>
      <video 
        id="player" 
        controls 
        preload="auto"
        playsinline
        webkit-playsinline
        x5-video-player-type="h5"
        x5-video-player-fullscreen="true"
        x5-video-orientation="landscape"
        style="width: 100%; height: 100%; background: #000;"
        onerror="onVideoError(event)"
        onloadedmetadata="onVideoLoaded(event)"
        onloadstart="onVideoLoadStart(event)"
        oncanplay="onVideoCanPlay(event)"
        onprogress="onVideoProgress(event)">
      <source src="{{stream_url}}" type="video/mp4; codecs=hevc,hvc1">
      <source src="{{stream_url}}" type="video/mp4">
      <source src="{{stream_url}}" type="video/x-matroska; codecs=hevc,hvc1">
      <source src="{{stream_url}}" type="video/x-matroska">
      <div class="error">
        <p>Your browser doesn't support H.265 (HEVC) video. Try using:</p>
        <ul>
          <li>Microsoft Edge (Windows 10/11)</li>
          <li>Safari (macOS High Sierra or later)</li>
          <li>VLC Media Player (for desktop)</li>
        </ul>
        <p>Or <a href="{{stream_url}}" download>download the video file</a> to play it locally.</p>
      </div>
      </video>
    </div>
    <div id="debug" class="debug"></div>
    <button id="debug-toggle" class="debug-toggle">Show Debug</button>
  </div>
  <script>
    const debugEl = document.getElementById('debug');
    const debugInfoEl = document.getElementById('debug-info');
    const playOverlay = document.getElementById('play-overlay');
    const playButton = document.getElementById('play-button');
    const videoContainer = document.getElementById('video-container');
    const video = document.getElementById('player');
    const debugToggle = document.getElementById('debug-toggle');
    let videoLoadStartTime = 0;
    let hasUserInteracted = false;
    let debugEnabled = localStorage.getItem('videoDebugEnabled') === 'true' || false;
    
    // Apply initial debug state
    if (!debugEnabled) {
      debugEl.style.display = 'none';
      debugToggle.textContent = 'Show Debug';
    } else {
      debugToggle.textContent = 'Hide Debug';
    }

    function log(message, isError = false) {
      const time = new Date().toISOString().substr(11, 8);
      const logEntry = document.createElement('div');
      logEntry.className = isError ? 'error' : '';
      logEntry.textContent = `[${time}] ${message}`;
      debugEl.appendChild(logEntry);
      debugEl.scrollTop = debugEl.scrollHeight;
      
      // Only log to console if debug is enabled
      if (debugEnabled) {
        if (isError) {
          console.error(message);
        } else {
          console.log(message);
        }
      }
    }

    function updateDebugInfo() {
      const v = document.getElementById('player');
      if (!v) return;
      
      const info = [
        `Ready State: ${v.readyState}`,
        `Network State: ${v.networkState}`,
        `Video Size: ${v.videoWidth}x${v.videoHeight || 0}`,
        `Current Time: ${v.currentTime.toFixed(2)} / ${v.duration ? v.duration.toFixed(2) : 'N/A'}`,
        `Buffered: ${v.buffered.length ? v.buffered.end(0).toFixed(2) : '0'}`,
        `Volume: ${v.volume * 100}%`,
        `Playback Rate: ${v.playbackRate}x`
      ];
      
      debugInfoEl.textContent = info.join(' | ');
      
      // Only show debug info if debug is enabled
      if (!debugEnabled) {
        debugInfoEl.style.display = 'none';
      } else {
        debugInfoEl.style.display = 'inline';
      }
    }

    // Event Handlers
    function onVideoLoadStart(e) {
      videoLoadStartTime = performance.now();
      log('Starting to load video...');
      updateDebugInfo();
    }

    function onVideoLoaded(e) {
      const loadTime = (performance.now() - videoLoadStartTime).toFixed(0);
      log(`Video metadata loaded in ${loadTime}ms`);
      updateDebugInfo();
    }

    async function startPlayback() {
      try {
        if (video.paused) {
          const playPromise = video.play();
          if (playPromise !== undefined) {
            await playPromise;
            playOverlay.classList.add('hidden');
            log('Playback started successfully');
          }
        }
      } catch (error) {
        log(`Playback failed: ${error.message}`, true);
      }
    }

    function onVideoCanPlay(e) {
      log('Video can play');
      updateDebugInfo();
      
      // Show play button overlay if user hasn't interacted yet
      if (!hasUserInteracted) {
        playOverlay.classList.remove('hidden');
      } else {
        startPlayback().catch(error => {
          log(`Auto-play failed: ${error.message}`, true);
        });
      }
    }

    function onVideoProgress(e) {
      updateDebugInfo();
    }

    function onVideoError(e) {
      const v = document.getElementById('player');
      let message = 'Video error ' + v.error.code + ': ';
      
      switch(v.error.code) {
        case v.error.MEDIA_ERR_ABORTED:
          message += 'You aborted the video playback.';
          break;
        case v.error.MEDIA_ERR_NETWORK:
          message += 'A network error caused the video download to fail.';
          break;
        case v.error.MEDIA_ERR_DECODE:
          message += 'The video playback was aborted due to a corruption problem or because the video uses features your browser did not support.';
          break;
        case v.error.MEDIA_ERR_SRC_NOT_SUPPORTED:
          message += 'The video could not be loaded, either because the server or network failed or because the format is not supported.';
          break;
        default:
          message += 'An unknown error occurred.';
      }
      
      log(message, true);
    }

    // Toggle debug information
    debugToggle.addEventListener('click', function() {
      debugEnabled = !debugEnabled;
      localStorage.setItem('videoDebugEnabled', debugEnabled);
      
      if (debugEnabled) {
        debugEl.style.display = 'block';
        debugInfoEl.style.display = 'inline';
        debugToggle.textContent = 'Hide Debug';
        log('Debug information enabled');
      } else {
        debugEl.style.display = 'none';
        debugInfoEl.style.display = 'none';
        debugToggle.textContent = 'Show Debug';
      }
    });
    
    // Initialize
    (function() {
      const startSecondsStr = "{{seconds_js}}";
      
      // Handle play button click
      playButton.addEventListener('click', async function(e) {
        e.stopPropagation();
        hasUserInteracted = true;
        await startPlayback();
      });

      // Handle click on video container (for touch devices)
      videoContainer.addEventListener('click', async function() {
        if (hasUserInteracted && !video.paused) {
          video.pause();
          playOverlay.classList.remove('hidden');
        } else if (hasUserInteracted && video.paused) {
          await startPlayback();
        }
      });
      
      // Handle keyboard events
      document.addEventListener('keydown', function(e) {
        if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyP') {
          e.preventDefault();
          if (hasUserInteracted) {
            if (video.paused) {
              startPlayback();
            } else {
              video.pause();
              playOverlay.classList.remove('hidden');
            }
          } else {
            hasUserInteracted = true;
            startPlayback();
          }
        }
      });
      
      // Handle touch events for mobile
      let touchStartY = 0;
      videoContainer.addEventListener('touchstart', function(e) {
        touchStartY = e.touches[0].clientY;
      }, { passive: true });
      
      videoContainer.addEventListener('touchend', function(e) {
        const touchEndY = e.changedTouches[0].clientY;
        // Only trigger play/pause for small vertical movements (not scrolls)
        if (Math.abs(touchEndY - touchStartY) < 10) {
          if (hasUserInteracted) {
            if (video.paused) {
              startPlayback();
            } else {
              video.pause();
              playOverlay.classList.remove('hidden');
            }
          } else {
            hasUserInteracted = true;
            startPlayback();
          }
        }
      }, { passive: true });
      
      // Handle seeking to start position
      if (startSecondsStr && startSecondsStr !== "null" && startSecondsStr !== "") {
        const startSeconds = parseFloat(startSecondsStr);
        log(`Will start at ${startSeconds} seconds`);
        
        video.addEventListener('loadedmetadata', function() {
          try { 
            video.currentTime = startSeconds; 
            log(`Seeked to ${startSeconds} seconds`);
          } catch (e) {
            log(`Failed to seek: ${e.message}`, true);
          }
        });
      }
      
      // Periodically update debug info if debug is enabled
      const debugInterval = setInterval(function() {
        if (debugEnabled) {
          updateDebugInfo();
        }
      }, 1000);
    })();
  </script>
</body>
</html>
