# remember escaping rules for regex: \ needs to be escaped as \\
emails:
  - type: "humankind"
    user_login: "johndoe"
    content_type: "text/html"
    sections:
      - section: "subject"
        match_regex: "(Zoom\\s+link)"
      - section: "body"
        dtstart_regex: "(\\d{1,2}:\\d{2}[ap]m)"
        dtstart_format: "%I:%M%p"
        timezone_regex: "(?i)\\d{1,2}:\\d{2}\\s*[ap]m\\s+(.*?)\\."
        timezone_mapping-ai:
          provider: "openrouter"
          model: "meta-llama/llama-4-maverick:free"
          prompt_template: "return the timezone string for '{input}' in IANA Time Zone Database (tzdata) format without any further information"
          api_key_env: "AI_API_KEY"
          api_url: "https://openrouter.ai/api/v1"
        url_regex: "href=\"(https://.*zoom.us/\\S*)\""
        title_regex: "You've booked in for (.*) for today at"
        duration_value: "75"
        instruction_value:
          process:
            - record: {}
          postprocess:
            - transcribe: {}
            - upload:
                delete: True
            - custom:
                task: "test"
                option1: "option1"
                option2: "option2"
        
  - type: "zoom_ics"
    user_login: "johndoe"
    content_type: "text/calendar"
    sections:
      - section: "calendar"
        dtstart_attribute: "begin"
        timezone_attribute: "timezone"
        timezone_mapping:
          - "AUS Eastern Standard Time": "Australia/Sydney"
          - "America/New_York": "America/New_York"
        url_attribute: "location"
        instruction_value:
          process:
            - join:
                display-name: 'Johndoe'
                join-audio: # no join audio, use '' for random audio file from audio dir or specific audio file 'hello.wav'
            - record:
          postprocess:
            - transcribe:
                # task: translate # default is transcribe
                # source-language: 'de' only reqired for translate
            - upload:
                delete: True
            - custom:
                - task: "summarize_transcript.py"
                  model: "google/gemini-2.0-flash-exp:free"
                  api-url: "https://openrouter.ai/api/v1"
                  api-key-env: "AI_API_KEY"
                  prompt: "You are a helpful assistant. Analyze the following transcript and create a html:\\n1. Identify all major topic changes.\\n2. Summarize each topic with:\\n   - Title and timestamp range \\n   - Very Detailed Summary\\n   - Link to recording file (example): <a target=\"popup\" onclick=\"window.open(this.href, 'popup', 'width=1000,height=700'); return false;\" href=\"{recording-link}.video-player.html?seconds=<replace with start timestamp in seconds>\">Play Video</a>)\\n\\nTranscript (as VTT file with timestamp format Minutes:Seconds:Milliseconds)\\n{content}"
                  content-filename-regex: "\\.[^.]+$|||.vtt"
                  recording-link-regex: "^.*[\\/\\\\](.*)\\.(.*)$|||\\1"
                  output-extension: ".html"
                  video-player-template: "/home/zoomrec/client/res/video-player.html"
                - task: "custom_task_test.py"
                  param1: "value1"
                  param2: "value2"
            - access:
                - http-server-access:
                    # access-key: "34tql0MN02KztivzqYF1"
                    expire-after-seconds: 604800
                    notify-user: True
                    additional-emails: "serv000001@kilchenmann.net, serv000002@kilchenmann.net "
            - custom:
                task: "test"
                option1: "option1"
                option2: "option2"
        title_attribute: "name"
        duration_attribute: "duration"
        rrule_attribute: "rrule"
