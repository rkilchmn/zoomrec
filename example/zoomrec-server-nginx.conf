limit_req_zone $binary_remote_addr zone=public:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=log:10m rate=2r/s;
limit_req_status 429;

server {
    listen 4443 ssl;
    http2 on;
    server_name server-tld.com;

    include /etc/nginx/mime.types;

    proxy_busy_buffers_size   512k;
    proxy_buffers             4 512k;
    proxy_buffer_size         256k;

    error_log  /var/log/nginx/server-tld.com_4443_error.log debug;
    access_log /var/log/nginx/server-tld.com_4443_access.log;

    ssl_certificate     /etc/ssl/selfsigned/server-tld.com.crt;
    ssl_certificate_key /etc/ssl/selfsigned/server-tld.com.key;

    ssl_protocols TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_ecdh_curve prime256v1;

    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # Proxy settings — inherited by all locations
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # Group 1: No auth / public — strictest limits
    location ~ ^/(access/validate|list/|file/) {
        limit_req zone=public burst=5 nodelay;
        proxy_pass http://127.0.0.1:8081;
    }

    # Group 3: Basic auth + high volume — minimal limits
    location ~ ^/log$ {
        limit_req zone=log burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081;
    }

    # Group 2: Basic auth — moderate limits (default for everything else)
    location / {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8081;
    }

    error_page 429 /429.json;
    location = /429.json {
        internal;
        default_type application/json;
        return 429 '{"error":"rate limit exceeded","retry_after":"60 seconds"}';
    }
}
